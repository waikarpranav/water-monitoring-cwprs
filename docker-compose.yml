version: "3.9"
services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: water-quality-db
    environment:
      POSTGRES_DB: waterquality
      POSTGRES_USER: wquser
      POSTGRES_PASSWORD: wqpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata: